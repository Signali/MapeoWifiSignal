# CI: revisa tipos y corre los tests contra un PostgreSQL 17 real en cada push y PR a main.
# Los valores de entorno son FALSOS a propósito: la base es descartable y vive solo durante el run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Versión fija (no ubuntu-latest): el entorno solo cambia cuando lo decidimos.
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:17
        env:
          # Superusuario del contenedor: solo crea el rol y la base, como en db/README.md (paso 1).
          POSTGRES_PASSWORD: ci_postgres_falsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Todo lo que valida backend/src/config.ts y scripts/seed.ts.
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: signalmap
      DB_NAME_TEST: signalmap_test
      DB_USER: signalmap_user
      DB_PASSWORD: ci_clave_falsa
      # >= 32 caracteres y distinto del de .env.example (lo exige config.ts).
      JWT_SECRET: ci_secreto_jwt_falso_solo_para_el_ci_0123456789
      JWT_EXPIRES_IN_ADMIN: 8h
      JWT_EXPIRES_IN_TECNICO: 10h
      JWT_EXPIRES_IN_CLIENTE: 2h
      SEED_ADMIN_PASSWORD: ci_admin_falsa
      SEED_TECNICO_PASSWORD: ci_tecnico_falsa
      SEED_CLIENTE_PASSWORD: ci_cliente_falsa
      SEED_WIFI_SSID: SignalMap Demo

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Crear rol y base de tests (db/README.md, paso 1)
        env:
          PGPASSWORD: ci_postgres_falsa
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE $DB_USER LOGIN PASSWORD '$DB_PASSWORD';" \
            -c "CREATE DATABASE $DB_NAME_TEST OWNER $DB_USER;"

      - name: Crear tablas con db/schema.sql (db/README.md, paso 2)
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: psql -h localhost -U "$DB_USER" -d "$DB_NAME_TEST" -v ON_ERROR_STOP=1 -f ../db/schema.sql

      # La web se compila antes de los tests: Express sirve frontend/dist (tests/web.test.ts).
      - name: Web - instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Web - revisar tipos
        working-directory: frontend
        run: npm run typecheck
      - name: Web - compilar
        working-directory: frontend
        run: npm run build

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Avisa si la app deja de compilar. No es obligatorio: no está en los checks de main.
  android:
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      # JDK 25: el que exige android/gradle/gradle-daemon-jvm.properties (así Gradle no descarga otro).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Sin setup-android: el runner ya trae el SDK de Android (ANDROID_HOME) y Gradle descarga lo que falte.
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew assembleDebug testDebugUnitTest
